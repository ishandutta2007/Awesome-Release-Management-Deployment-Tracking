<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pipeline Flow -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.18); opacity: 0.6; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -80; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanline {
      0% { transform: translateX(-100px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    @keyframes beaconPulse {
      0% { r: 5; opacity: 0.9; }
      50% { r: 12; opacity: 0.2; }
      100% { r: 5; opacity: 0.9; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 260px; }
    .flowing-pipe { stroke-dasharray: 10 10; animation: dashCycle 2.5s linear infinite; }
    .card-anim-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-anim-2 { animation: floatCard2 6s ease-in-out infinite 0.7s; }
    .card-anim-3 { animation: floatCard3 5.5s ease-in-out infinite 1.4s; }
    .beacon { animation: beaconPulse 2s ease-in-out infinite; }
    .scan-beam { animation: scanline 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="270" r="160" fill="#a855f7" filter="url(#glow)" />

  <!-- Tech Grid Background Pattern -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Pipeline Track Behind Badges/Cards -->
  <g fill="none" stroke-linecap="round">
    <path d="M 60 295 L 360 295 Q 400 295 420 280 L 460 250 Q 480 235 520 235 L 700 235 Q 740 235 760 255 L 800 295 L 1140 295" stroke="#1e293b" stroke-width="6" />
    <path class="flowing-pipe" d="M 60 295 L 360 295 Q 400 295 420 280 L 460 250 Q 480 235 520 235 L 700 235 Q 740 235 760 255 L 800 295 L 1140 295" stroke="url(#pipeGrad)" stroke-width="4" filter="url(#glow)" />
  </g>

  <!-- Interactive Floating Metric & Status Pills (Positioned harmoniously) -->
  <g class="card-anim-1">
    <rect x="75" y="240" width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="95" cy="261" r="5" fill="#38bdf8" />
    <circle class="beacon" cx="95" cy="261" r="5" stroke="#38bdf8" fill="none" stroke-width="2" />
    <text x="110" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">CI/CD Orchestration</text>
  </g>

  <g class="card-anim-2">
    <rect x="495" y="270" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="517" cy="291" r="5" fill="#10b981" />
    <circle class="beacon" cx="517" cy="291" r="5" stroke="#10b981" fill="none" stroke-width="2" />
    <text x="532" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">GitOps &amp; Continuous Delivery</text>
  </g>

  <g class="card-anim-3">
    <rect x="910" y="240" width="195" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="932" cy="261" r="5" fill="#c084fc" />
    <circle class="beacon" cx="932" cy="261" r="5" stroke="#c084fc" fill="none" stroke-width="2" />
    <text x="947" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fae8ff">DORA Metrics &amp; Tracking</text>
  </g>

  <!-- Foreground Title and Hero Content (Clear, crisp, perfectly contrasted) -->
  <g text-anchor="middle">
    <!-- Top Category Tag -->
    <rect x="475" y="42" width="250" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="600" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8">🚀 CURATED DEVSECOPS DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
      Release Management &amp; Deployment Tracking
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Top Commercial SaaS &amp; Open-Source Platforms for Orchestration, Canary Deployments, and DORA Governance
    </text>

    <!-- Meta Highlights -->
    <text x="600" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
      ⚡ GitOps • Automated Rollbacks • Progressive Delivery • Audit Trails • Feature Flags
    </text>
  </g>

  <!-- Bottom Border Highlight -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#accentGrad)" stroke-width="3" />
</svg>
